<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Cache-Control" content="no-store">
<title>อิ่มอุ่น • อ่านเอกสาร</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#292929;background:#fff5f8}
body{margin:0}.wrap{max-width:680px;margin:auto;padding:calc(18px + env(safe-area-inset-top)) 18px 30px}
.card{background:#fff;border-radius:22px;padding:20px;box-shadow:0 8px 28px #00000012}
h1{font-size:22px;margin:0 0 8px}.muted{color:#6b7280;line-height:1.55}.privacy{font-size:14px;background:#fdf2f8;padding:12px;border-radius:12px}
.preview{display:block;max-width:100%;max-height:360px;margin:14px auto;border-radius:14px}
.bar{height:10px;background:#eee;border-radius:99px;overflow:hidden;margin:18px 0}.fill{height:100%;width:0;background:#f48fb1;transition:width .2s}
.ok,.err{padding:14px;border-radius:14px;margin-top:14px;line-height:1.55}.ok{background:#ecfdf5}.err{background:#fff1f2;color:#9f1239}
button{width:100%;border:0;border-radius:14px;padding:14px 18px;font-size:16px;font-weight:700;background:#f48fb1;color:#fff}
.small{font-size:13px;color:#6b7280;margin-top:14px}
</style>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@7.0.0/dist/tesseract.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
</head>
<body>
<div class="wrap"><div class="card">
<h1>🔎 อ่านรูป/เอกสาร</h1>
<p class="muted">อิ่มอุ่นกำลังอ่านข้อความจากไฟล์ เพื่อให้คุณตรวจสอบก่อนยืนยัน</p>
<p class="privacy">🔒 OCR ทำบนอุปกรณ์นี้ รูปหรือ PDF จะไม่ถูกส่งไปบริการ OCR ภายนอก</p>
<div id="media"></div>
<div id="status">กำลังตรวจสอบลิงก์…</div>
<div class="bar"><div id="fill" class="fill"></div></div>
<div id="result"></div>
<button id="run" hidden>ลองอ่านอีกครั้ง</button>
<div class="small">ลิงก์สำหรับการตรวจรายการนี้มีอายุจำกัด และการอ่านข้อมูลขั้นนี้ยังไม่สร้างข้อมูลสุขภาพจริง</div>
</div></div>
<script>
const API='https://buxvdlfrikpwdscdlcfd.supabase.co/functions/v1/line-intake-review';
const st=document.getElementById('status'),fill=document.getElementById('fill'),res=document.getElementById('result'),btn=document.getElementById('run'),media=document.getElementById('media');
if(window.pdfjsLib)pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';
function getToken(){return new URLSearchParams(location.hash.replace(/^#/,'')).get('token')||''}
function setStatus(t,p){st.textContent=t;if(Number.isFinite(p))fill.style.width=Math.max(0,Math.min(100,p))+'%'}
async function api(body){
 const r=await fetch(API,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body),cache:'no-store'});
 const d=await r.json().catch(()=>({}));
 if(!r.ok||!d.ok)throw new Error(d.error||('HTTP '+r.status));
 return d;
}
async function createOcrWorker(){
 return await Tesseract.createWorker(['tha','eng'],1,{
  workerPath:'https://cdn.jsdelivr.net/npm/tesseract.js@7.0.0/dist/worker.min.js',
  corePath:'https://cdn.jsdelivr.net/npm/tesseract.js-core@7.0.0',
  langPath:'https://tessdata.projectnaptha.com/4.0.0_fast',
  logger:m=>{if(m.status==='recognizing text')setStatus('กำลังอ่านข้อความ…',Math.round((m.progress||0)*100))}
 });
}
async function imageOCR(w,file){
 const r=await w.recognize(file,{rotateAuto:true});
 return{text:r.data?.text||'',confidence:Number(r.data?.confidence||0)};
}
async function pdfOCR(w,file){
 setStatus('กำลังเปิด PDF…',5);
 const data=await(await fetch(file,{cache:'no-store'})).arrayBuffer();
 const pdf=await pdfjsLib.getDocument({data}).promise;
 let all=[],confs=[];const pages=Math.min(pdf.numPages,3);
 for(let i=1;i<=pages;i++){
  const p=await pdf.getPage(i),tc=await p.getTextContent(),direct=tc.items.map(x=>x.str||'').join(' ').trim();
  if(direct.length>30){
   all.push(direct);confs.push(100);setStatus('อ่านข้อความหน้า '+i+'/'+pages,Math.round(i/pages*100));continue;
  }
  const vp=p.getViewport({scale:1.6}),canvas=document.createElement('canvas');
  canvas.width=Math.ceil(vp.width);canvas.height=Math.ceil(vp.height);
  await p.render({canvasContext:canvas.getContext('2d'),viewport:vp}).promise;
  const r=await w.recognize(canvas,{rotateAuto:true});
  all.push(r.data?.text||'');confs.push(Number(r.data?.confidence||0));
  setStatus('อ่านข้อความหน้า '+i+'/'+pages,Math.round(i/pages*100));
 }
 return{text:all.join('\n\n--- หน้าใหม่ ---\n\n'),confidence:confs.length?confs.reduce((a,b)=>a+b,0)/confs.length:0};
}
async function run(){
 btn.hidden=true;res.innerHTML='';media.innerHTML='';let w;
 try{
  const token=getToken();if(!token)throw new Error('ลิงก์ไม่ถูกต้องหรือหมดอายุ');
  setStatus('กำลังเปิดไฟล์…',1);
  const boot=await api({action:'bootstrap',token});
  if(boot.mime_type!=='application/pdf'){
   const img=document.createElement('img');img.className='preview';img.src=boot.file_url;img.alt='ไฟล์ที่กำลังตรวจ';media.appendChild(img);
  }
  setStatus('กำลังโหลด OCR ภาษาไทยและอังกฤษ…',2);
  w=await createOcrWorker();
  const out=boot.mime_type==='application/pdf'?await pdfOCR(w,boot.file_url):await imageOCR(w,boot.file_url);
  setStatus('กำลังบันทึกผลเพื่อให้คุณตรวจ…',98);
  await api({action:'ocr_result',token,raw_text:(out.text||'').slice(0,20000),confidence:out.confidence});
  setStatus('เสร็จแล้ว',100);
  res.innerHTML='<div class="ok">✅ อ่านเอกสารเสร็จแล้ว<br><br>กลับไปที่ LINE เพื่อดูข้อความที่อ่านได้ แล้วเลือก <b>ยืนยัน</b> หรือ <b>ยกเลิก</b></div>';
 }catch(e){
  setStatus('อ่านเอกสารไม่สำเร็จ',0);
  const msg=String(e?.message||e);
  res.innerHTML='<div class="err">⚠️ '+msg.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))+'</div>';
  btn.hidden=false;
 }finally{try{if(w)await w.terminate()}catch{}}
}
btn.onclick=run;
run();
</script>
</body>
</html>
