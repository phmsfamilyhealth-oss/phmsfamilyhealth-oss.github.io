<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Cache-Control" content="no-store">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; worker-src blob: https://cdn.jsdelivr.net; connect-src https://buxvdlfrikpwdscdlcfd.supabase.co https://cdn.jsdelivr.net https://tessdata.projectnaptha.com; img-src 'self' blob: data: https://buxvdlfrikpwdscdlcfd.supabase.co; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<title>อิ่มอุ่น • อ่านเอกสาร</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#292929;background:#fff5f8}
body{margin:0}.wrap{max-width:680px;margin:auto;padding:calc(18px + env(safe-area-inset-top)) 18px 30px}
.card{background:#fff;border-radius:22px;padding:20px;box-shadow:0 8px 28px #00000012}
h1{font-size:22px;margin:0 0 8px}.muted{color:#6b7280;line-height:1.55}.privacy{font-size:14px;background:#fdf2f8;padding:12px;border-radius:12px}
.preview{display:block;max-width:100%;max-height:380px;margin:14px auto;border-radius:14px;background:#fff}
.bar{height:10px;background:#eee;border-radius:99px;overflow:hidden;margin:18px 0}.fill{height:100%;width:0;background:#f48fb1;transition:width .2s}
.ok,.err,.note{padding:14px;border-radius:14px;margin-top:14px;line-height:1.55}.ok{background:#ecfdf5}.err{background:#fff1f2;color:#9f1239}.note{background:#eff6ff;color:#334155}
button{width:100%;border:0;border-radius:14px;padding:14px 18px;font-size:16px;font-weight:700;background:#f48fb1;color:#fff}
.small{font-size:13px;color:#6b7280;margin-top:14px}
</style>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@7.0.0/dist/tesseract.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
</head>
<body>
<div class="wrap"><div class="card">
<h1>🔎 อ่านรูป/เอกสาร</h1>
<p class="muted">อิ่มอุ่นจะลองอ่านข้อความบนเครื่องนี้ก่อน ถ้าอ่านไม่ชัดจะพากลับ LINE เพื่อกรอกเอง</p>
<p class="privacy">🔒 OCR ทำบนอุปกรณ์นี้ รูปหรือ PDF จะไม่ถูกส่งไปบริการ OCR ภายนอก</p>
<div id="media"></div>
<div id="status">กำลังตรวจสอบลิงก์…</div>
<div class="bar"><div id="fill" class="fill"></div></div>
<div id="detail" class="small"></div>
<div id="result"></div>
<button id="run" hidden>ลองอ่านอีกครั้ง</button>
<div class="small">หลังอ่านเสร็จ ระบบจะพยายามปิดหน้านี้และกลับ LINE ให้อัตโนมัติ</div>
</div></div>
<script>
const API='https://buxvdlfrikpwdscdlcfd.supabase.co/functions/v1/line-intake-review';
const MAX_DIM=1800,PROBE_DIM=650;
const st=document.getElementById('status'),fill=document.getElementById('fill'),res=document.getElementById('result'),btn=document.getElementById('run'),media=document.getElementById('media'),detail=document.getElementById('detail');
if(window.pdfjsLib)pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';

function getToken(){return new URLSearchParams(location.hash.replace(/^#/,'')).get('token')||''}
function setStatus(t,p,d=''){st.textContent=t;if(Number.isFinite(p))fill.style.width=Math.max(0,Math.min(100,p))+'%';detail.textContent=d}
function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function sleep(ms){return new Promise(r=>setTimeout(r,ms))}
let runDone=false,activeWorker=null,wakeLock=null;
async function keepAwake(){try{if('wakeLock' in navigator)wakeLock=await navigator.wakeLock.request('screen')}catch{}}
async function releaseWake(){try{if(wakeLock)await wakeLock.release()}catch{}wakeLock=null}

async function api(body){
 const r=await fetch(API,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body),cache:'no-store'});
 const d=await r.json().catch(()=>({}));
 if(!r.ok||!d.ok)throw new Error(d.error||('HTTP '+r.status));
 return d;
}
async function fileBlob(url){
 const r=await fetch(url,{cache:'no-store'});
 if(!r.ok)throw new Error('เปิดไฟล์ไม่ได้');
 return await r.blob();
}
async function blobImage(blob){
 const u=URL.createObjectURL(blob);
 try{
  const img=new Image();
  img.decoding='async';
  await new Promise((ok,bad)=>{img.onload=ok;img.onerror=bad;img.src=u});
  return img;
 }finally{setTimeout(()=>URL.revokeObjectURL(u),1000)}
}
function scaledCanvas(img,maxDim=1400){
 const scale=Math.min(1,maxDim/Math.max(img.naturalWidth||img.width,img.naturalHeight||img.height));
 const w=Math.max(1,Math.round((img.naturalWidth||img.width)*scale)),h=Math.max(1,Math.round((img.naturalHeight||img.height)*scale));
 const c=document.createElement('canvas');c.width=w;c.height=h;
 c.getContext('2d',{alpha:false}).drawImage(img,0,0,w,h);
 return c;
}
function rotateCanvas(source,degrees){
 const d=((Math.round(degrees)%360)+360)%360;
 if(!d)return source;
 const swap=d===90||d===270;
 const c=document.createElement('canvas');c.width=swap?source.height:source.width;c.height=swap?source.width:source.height;
 const x=c.getContext('2d',{alpha:false});x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);
 x.translate(c.width/2,c.height/2);x.rotate(d*Math.PI/180);x.drawImage(source,-source.width/2,-source.height/2);
 return c;
}
function enhanceCanvas(source){
 const scale=Math.min(1,MAX_DIM/Math.max(source.width,source.height));
 const w=Math.max(1,Math.round(source.width*scale)),h=Math.max(1,Math.round(source.height*scale));
 const c=document.createElement('canvas');c.width=w;c.height=h;
 const x=c.getContext('2d',{alpha:false});x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(source,0,0,w,h);
 const im=x.getImageData(0,0,w,h),p=im.data;
 let mean=0,count=0;
 for(let i=0;i<p.length;i+=16){mean+=(p[i]*0.299+p[i+1]*0.587+p[i+2]*0.114);count++}
 mean=count?mean/count:180;
 const contrast=mean<145?1.18:1.34;
 const lift=mean<145?22:8;
 for(let i=0;i<p.length;i+=4){
  const g=p[i]*0.299+p[i+1]*0.587+p[i+2]*0.114;
  const v=Math.max(0,Math.min(255,(g-128)*contrast+128+lift));
  p[i]=p[i+1]=p[i+2]=v;p[i+3]=255;
 }
 x.putImageData(im,0,0);
 return c;
}
function usefulRatio(text){
 const compact=String(text||'').replace(/\s/g,'');if(!compact)return 0;
 const useful=(compact.match(/[\p{L}\p{N}]/gu)||[]).length;
 return useful/compact.length;
}
function domainHits(text){
 const s=String(text||'').toLowerCase();
 const pats=[/นัด|appointment|follow[- ]?up/,/เวลา|time|\b\d{1,2}[:.]\d{2}\b/,/วันที่|date|\b\d{1,2}[\/.-]\d{1,2}[\/.-]\d{2,4}\b/,/\bhn\b|hospital number/,/คลินิก|แผนก|doctor|แพทย์/,/ยา|medication|\bmg\b|tablet|รับประทาน/,/ใบเสร็จ|receipt|total|บาท/];
 return pats.reduce((n,p)=>n+(p.test(s)?1:0),0);
}
function quality(result){
 const text=String(result?.data?.text||'');
 const conf=Math.max(0,Math.min(100,Number(result?.data?.confidence||0)));
 const ratio=usefulRatio(text);
 const lengthBonus=Math.min(12,Math.log10(Math.max(1,text.replace(/\s/g,'').length))*5);
 return Math.max(0,Math.min(100,conf*.60+ratio*18+lengthBonus+Math.min(10,domainHits(text)*2)));
}
async function chooseRotation(w,img){
 const probeBase=scaledCanvas(img,PROBE_DIM);
 const landscape=probeBase.width>probeBase.height*1.10;
 const rotations=landscape?[90,270]:[0,180];
 await w.setParameters({tessedit_pageseg_mode:Tesseract.PSM.SPARSE_TEXT,preserve_interword_spaces:'1',user_defined_dpi:'220'});
 let best={rotation:rotations[0],score:-1,confidence:0};
 for(let i=0;i<rotations.length;i++){
  if(runDone)throw new Error('ocr_cancelled');
  const rot=rotations[i];
  setStatus('กำลังหามุมเอกสาร…',18+Math.round(i/rotations.length*14),'ลองมุม '+rot+'°');
  const probe=enhanceCanvas(rotateCanvas(probeBase,rot));
  const r=await w.recognize(probe);
  const score=quality(r);
  if(score>best.score)best={rotation:rot,score,confidence:Number(r?.data?.confidence||0)};
 }
 return best;
}
async function createOcrWorker(){
 setStatus('กำลังโหลด OCR ภาษาไทย…',8,'โมเดลขนาดเล็กสำหรับมือถือ');
 let timer;
 const timeout=new Promise((_,reject)=>{timer=setTimeout(()=>reject(new Error('โหลด OCR นานเกินไป กรุณาลองใหม่')),25000)});
 try{
  const w=await Promise.race([
   Tesseract.createWorker('tha',Tesseract.OEM.LSTM_ONLY,{
    workerPath:'https://cdn.jsdelivr.net/npm/tesseract.js@7.0.0/dist/worker.min.js',
    corePath:'https://cdn.jsdelivr.net/npm/tesseract.js-core@7.0.0',
    langPath:'https://tessdata.projectnaptha.com/4.0.0_fast',
    logger:m=>{
     if(m.status==='loading language traineddata')setStatus('กำลังโหลดภาษาไทย…',10,'ครั้งแรกอาจใช้เวลาสักครู่');
     if(m.status==='initializing api')setStatus('กำลังเตรียม OCR…',14);
     if(m.status==='recognizing text'){
      const p=30+Math.round((m.progress||0)*58);
      setStatus('กำลังอ่านข้อความ…',p,'กำลังประมวลผลบนอุปกรณ์');
     }
    }
   }),
   timeout
  ]);
  if(runDone){try{await w.terminate()}catch{};throw new Error('ocr_cancelled')}
  activeWorker=w;
  return w;
 }finally{clearTimeout(timer)}
}
async function bestImageOCR(w,canvas){
 setStatus('กำลังอ่านข้อความ…',22,'โหมดเอกสารหลายช่อง');
 let best=await w.recognize(canvas);
 let bestQ=quality(best),mode='auto';
 if(bestQ<58||Number(best?.data?.confidence||0)<48){
  setStatus('กำลังเก็บข้อความเพิ่มเติม…',70,'ผลรอบแรกยังไม่ชัด จึงลองโหมดข้อความกระจาย');
  await w.setParameters({tessedit_pageseg_mode:Tesseract.PSM.SPARSE_TEXT,preserve_interword_spaces:'1',user_defined_dpi:'300'});
  const retry=await w.recognize(canvas);
  const q=quality(retry);
  if(q>bestQ){best=retry;bestQ=q;mode='sparse_text'}
 }
 return {text:String(best?.data?.text||''),confidence:Number(best?.data?.confidence||0),quality:bestQ,mode};
}
async function imageOCR(fileUrl){
 const blob=await fileBlob(fileUrl),img=await blobImage(blob),w=await createOcrWorker();
 try{
  const orient=await chooseRotation(w,img);
  setStatus('เลือกมุม '+orient.rotation+'°',34,'คะแนนมุม '+Math.round(orient.score)+'/100');
  const full=enhanceCanvas(rotateCanvas(scaledCanvas(img,MAX_DIM),orient.rotation));
  media.replaceChildren(full);full.className='preview';

  await w.setParameters({tessedit_pageseg_mode:Tesseract.PSM.AUTO,preserve_interword_spaces:'1',user_defined_dpi:'300'});
  setStatus('กำลังอ่านข้อความจริง…',38,'โหมดเอกสารอัตโนมัติ');
  let best=await w.recognize(full),bestQ=quality(best),mode='auto';

  if(bestQ<58||Number(best?.data?.confidence||0)<48){
   setStatus('กำลังเก็บข้อความเพิ่มเติม…',76,'ผลรอบแรกยังไม่ชัด');
   await w.setParameters({tessedit_pageseg_mode:Tesseract.PSM.SPARSE_TEXT,preserve_interword_spaces:'1',user_defined_dpi:'300'});
   const retry=await w.recognize(full),q=quality(retry);
   if(q>bestQ){best=retry;bestQ=q;mode='sparse_text'}
  }
  return {
   text:String(best?.data?.text||''),
   confidence:Number(best?.data?.confidence||0),
   quality:bestQ,
   mode,
   orientation_degrees:orient.rotation,
   preprocessing:'multi-rotation-probe+grayscale+contrast'
  };
 }finally{try{await w.terminate()}catch{}if(activeWorker===w)activeWorker=null}
}
async function pdfOCR(fileUrl){
 setStatus('กำลังเปิด PDF…',5);
 const data=await(await fetch(fileUrl,{cache:'no-store'})).arrayBuffer();
 const pdf=await pdfjsLib.getDocument({data}).promise;
 let all=[],confs=[],qualities=[],mode='pdf_text',w=null;
 const pages=Math.min(pdf.numPages,3);
 try{
  for(let i=1;i<=pages;i++){
   const p=await pdf.getPage(i),tc=await p.getTextContent(),direct=tc.items.map(x=>x.str||'').join(' ').trim();
   if(direct.length>40){all.push(direct);confs.push(100);qualities.push(100);setStatus('อ่านข้อความหน้า '+i+'/'+pages,Math.round(i/pages*90));continue}
   if(!w)w=await createOcrWorker();
   const vp=p.getViewport({scale:2}),canvas=document.createElement('canvas');canvas.width=Math.ceil(vp.width);canvas.height=Math.ceil(vp.height);
   await p.render({canvasContext:canvas.getContext('2d'),viewport:vp}).promise;
   const enhanced=enhanceCanvas(canvas),r=await bestImageOCR(w,enhanced);
   all.push(r.text);confs.push(r.confidence);qualities.push(r.quality);mode=r.mode;
  }
  return {
   text:all.join('\n\n--- หน้าใหม่ ---\n\n'),
   confidence:confs.length?confs.reduce((a,b)=>a+b,0)/confs.length:0,
   quality:qualities.length?qualities.reduce((a,b)=>a+b,0)/qualities.length:0,
   mode,orientation_degrees:0,preprocessing:'pdf_text_or_grayscale+contrast'
  };
 }finally{try{if(w)await w.terminate()}catch{}if(activeWorker===w)activeWorker=null}
}
async function autoClose(){
 await sleep(650);
 try{window.close()}catch{}
 await sleep(500);
 if(document.visibilityState==='visible'){
  try{history.back()}catch{}
 }
}
async function run(){
 btn.hidden=true;res.innerHTML='';media.innerHTML='';detail.textContent='';runDone=false;
 const token=getToken();
 if(!token){setStatus('อ่านเอกสารไม่สำเร็จ',0);res.innerHTML='<div class="err">⚠️ ลิงก์ไม่ถูกต้องหรือหมดอายุ</div>';return}
 await keepAwake();
 let hardTimer,slowTimer;
 const hardTimeout=new Promise((_,reject)=>{hardTimer=setTimeout(()=>reject(new Error('ocr_hard_timeout')),90000)});
 try{
  setStatus('กำลังเปิดไฟล์…',1);
  const boot=await api({action:'bootstrap',token});
  if(boot.intent_resource==='appointment'){
    slowTimer=setTimeout(()=>{api({action:'processing_slow',token}).catch(err=>console.error('processing_slow',err))},60000);
  }
  const out=await Promise.race([
    boot.mime_type==='application/pdf'?pdfOCR(boot.file_url):imageOCR(boot.file_url),
    hardTimeout
  ]);
  setStatus('กำลังส่งผลให้ LINE…',96,'ตรวจคุณภาพ OCR '+Math.round(out.quality||0)+'/100');
  await api({
    action:'ocr_result',token,
    raw_text:(out.text||'').slice(0,20000),
    confidence:out.confidence,
    quality_score:out.quality,
    orientation_degrees:out.orientation_degrees,
    page_segmentation:out.mode,
    preprocessing:out.preprocessing
  });
  runDone=true;clearTimeout(hardTimer);clearTimeout(slowTimer);await releaseWake();
  setStatus('ส่งผลกลับ LINE แล้ว',100,'กำลังกลับ LINE…');
  res.innerHTML='<div class="ok">✅ อ่านเอกสารเสร็จแล้ว<br><br>ผลถูกส่งกลับ LINE แล้ว กำลังปิดหน้านี้อัตโนมัติ…</div>';
  autoClose();
 }catch(e){
  console.error(e);runDone=true;clearTimeout(hardTimer);clearTimeout(slowTimer);
  try{if(activeWorker)await activeWorker.terminate()}catch{}activeWorker=null;
  await releaseWake();
  const msg=String(e?.message||e);
  if(msg!=='ocr_cancelled'){
    try{await api({action:'manual_fallback',token,reason:msg==='ocr_hard_timeout'?'ocr_timeout_mobile':'ocr_client_error'})}catch(err){console.error('manual_fallback',err)}
  }
  setStatus('เปลี่ยนไปกรอกเองใน LINE',100,'กำลังกลับ LINE…');
  res.innerHTML='<div class="note">✍️ OCR บนมือถือใช้เวลานานหรืออ่านไม่ชัด<br><br>อิ่มอุ่นส่งขั้นตอน “กรอกเอง” กลับไปใน LINE แล้ว กำลังปิดหน้านี้…</div>';
  autoClose();
 }
}
btn.onclick=run;
run();
</script>
</body>
</html>
