name: PHMS v2.4 Pages HTTPS smoke
on:
  push:
    branches: [main]
    paths:
      - 'phms-v24-pilot/**'
      - '.github/workflows/phms-v24-pages-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pages-http:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify linked-care person, date, and command safety
        run: node --test phms-v24-pilot/contracts/linked-appointment-workflow.test.mjs phms-v24-pilot/contracts/appointment-ux-structure.test.mjs
      - name: Confirm deployed HTTPS HTML and browser modules
        shell: bash
        run: |
          set -euo pipefail
          base='https://phmsfamilyhealth-oss.github.io/phms-v24-pilot'
          for path in prototype/index.html contracts/scenario-validator.mjs contracts/draft-packager.mjs contracts/provider-picker-state.mjs contracts/provider-hierarchy.mjs contracts/liff-confirm-client.mjs contracts/liff-provider-catalog-client.mjs contracts/linked-appointment-workflow.mjs; do
            echo "Checking $base/$path"
            curl --fail --location --silent --show-error --retry 8 --retry-delay 5 --retry-all-errors --max-time 15 -o /tmp/phms-check "$base/$path"
            test -s /tmp/phms-check
            if [[ "$path" == 'prototype/index.html' ]]; then
              grep -q 'PHMS — เพิ่มนัดหมาย' /tmp/phms-check
              for attempt in $(seq 1 24); do
                if grep -q 'name="phms-liff-id" content="2011619364-D0xazyre"' /tmp/phms-check; then break; fi
                sleep 5
                curl --fail --location --silent --show-error --max-time 15 -o /tmp/phms-check "$base/$path"
              done
              grep -q 'name="phms-liff-id" content="2011619364-D0xazyre"' /tmp/phms-check
              for attempt in $(seq 1 24); do
                if grep -q 'id="prepEntry"' /tmp/phms-check && ! grep -q '<textarea id="prep"' /tmp/phms-check; then break; fi
                sleep 5
                curl --fail --location --silent --show-error --max-time 15 -o /tmp/phms-check "$base/$path?checklist-release=20261030"
              done
              grep -q 'id="prepEntry"' /tmp/phms-check
              grep -q 'id="prepAdd"' /tmp/phms-check
              grep -q 'โหมดทดลอง — ยังบันทึกไม่ได้' /tmp/phms-check
              grep -q 'id="relatedCards"' /tmp/phms-check
              grep -q 'function thaiSourceDate' /tmp/phms-check
              grep -Fq 'TH_DAYS[date.getUTCDay()]' /tmp/phms-check
              if grep -q 'id="relatedAll"' /tmp/phms-check; then echo 'ERROR: legacy appointment dropdown controls still published'; exit 1; fi
              grep -q 'id="contactLoad"' /tmp/phms-check
              grep -q 'id="procedureAdd"' /tmp/phms-check
              grep -q 'id="appointmentPhotoPicker"' /tmp/phms-check
              grep -q 'id="historicalLinkedVisitSection"' /tmp/phms-check
              grep -q 'id="openCanonicalFinance"' /tmp/phms-check
              grep -q 'id="openCanonicalMedication"' /tmp/phms-check
          grep -q 'id="appointmentPhotoList"' /tmp/phms-check
          grep -q 'id="hasAppointmentPhotos"' /tmp/phms-check
              grep -q 'id="save" disabled' /tmp/phms-check
              if grep -q '<textarea id="prep"' /tmp/phms-check; then echo 'ERROR: old checklist still published'; exit 1; fi
            else
              grep -Eq 'export |import ' /tmp/phms-check
            fi
          done
          echo 'Published GitHub Pages HTML and browser modules: HTTP 200, content verified'
      - name: Verify read-only backend rejects unauthenticated caller
        shell: bash
        run: |
          set -euo pipefail
          url='https://buxvdlfrikpwdscdlcfd.supabase.co/functions/v1/phms-v24-appointment-read'
          status=$(curl --silent --show-error --location --max-time 20 -o /tmp/phms-read-response -w '%{http_code}' -X POST -H 'content-type: application/json' -d '{"action":"person_options"}' "$url")
          echo "Unauthenticated read-only API status: $status"
          test "$status" = '401'
          grep -q 'unauthenticated' /tmp/phms-read-response
          for action in appointment_sources reschedule_contact; do
            code=$(curl --silent --show-error --location --max-time 20 -o /tmp/phms-read-response -w '%{http_code}' -X POST -H 'content-type: application/json' -d "{\"action\":\"$action\",\"selectedPersonCode\":\"11111111-1111-4111-8111-111111111111\",\"organizationId\":\"22222222-2222-4222-8222-222222222222\"}" "$url")
            echo "Unauthenticated $action status: $code"
            test "$code" = '401'
            grep -q 'unauthenticated' /tmp/phms-read-response
          done

