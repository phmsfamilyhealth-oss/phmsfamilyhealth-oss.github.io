name: PHMS v2.4 Contract Regression
on:
  pull_request:
    paths:
      - 'release/smart-appointment-v24/contracts/**'
      - 'release/smart-appointment-v24/tests/*.mjs'
      - '.github/workflows/phms-v24-contract.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scenario-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run isolated contract tests (no service secrets)
        run: node --test release/smart-appointment-v24/tests/*.test.mjs
