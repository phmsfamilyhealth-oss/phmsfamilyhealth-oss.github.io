name: PHMS v2.4 Contract Regression
on:
  pull_request:
    paths:
      - 'release/smart-appointment-v24/contracts/**'
      - 'release/smart-appointment-v24/tests/*.mjs'
      - '.github/workflows/phms-v24-contract.yml'
      - 'release/smart-appointment-v24/migrations/**'
      - 'release/smart-appointment-v24/tests/*.sql'
      - 'release/smart-appointment-v24/edge-candidate/**'
      - 'release/smart-appointment-v24/scripts/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scenario-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate and package full Edge dependency closure
        run: node release/smart-appointment-v24/scripts/package-edge.mjs
      - name: Smoke build deployable LIFF site with synthetic public configuration
        env:
          PHMS_V24_PUBLIC_LIFF_ID: '1234567890-abcdefgh'
          PHMS_V24_PUBLIC_CONFIRM_API: 'https://buxvdlfrikpwdscdlcfd.supabase.co/functions/v1/phms-v24-appointment-confirm'
        run: |
          node release/smart-appointment-v24/scripts/build-liff-site.mjs /tmp/phms-v24-liff-smoke
          test -s /tmp/phms-v24-liff-smoke/prototype/index.html
          test -s /tmp/phms-v24-liff-smoke/contracts/provider-hierarchy.mjs
      - name: Run isolated contract tests (no service secrets)
        run: node --test release/smart-appointment-v24/tests/*.test.mjs

  postgres-atomic-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test_only
          POSTGRES_DB: phms_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: test_only
      PGDATABASE: phms_test
    steps:
      - uses: actions/checkout@v4
      - name: Run real PostgreSQL migration and atomic smoke (isolated, synthetic)
        run: psql -v ON_ERROR_STOP=1 -f release/smart-appointment-v24/tests/postgres-atomic-smoke.sql
