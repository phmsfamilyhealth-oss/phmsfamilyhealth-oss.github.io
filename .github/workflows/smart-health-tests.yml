name: Smart Health isolated integration
on:
  pull_request:
    paths:
      - 'supabase/**'
      - 'tests/**'
      - 'package*.json'
      - '.github/workflows/smart-health-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx deno check --config deno-check.json supabase/functions/line-webhook/index.ts
