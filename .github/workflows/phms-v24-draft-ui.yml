name: PHMS v2.4 draft save/open/delete UI
on:
  push:
    branches: [main]
    paths:
      - 'phms-v24-pilot/**'
      - '.github/workflows/phms-v24-draft-ui.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  draft-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated Chromium runtime
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps --only-shell chromium
      - name: Verify private draft UI using synthetic LINE and mock Supabase
        run: node phms-v24-pilot/contracts/draft-ux-smoke.mjs
