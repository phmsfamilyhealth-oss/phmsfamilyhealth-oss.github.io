name: Appointment native PostgreSQL release gates
on:
  pull_request:
  push:
    branches: [fix/phms-appointment-recovery]
permissions:
  contents: read
jobs:
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_PASSWORD: synthetic-ci-password
          POSTGRES_DB: phms_synthetic_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PHMS_TEST_DATABASE_URL: postgres://postgres:synthetic-ci-password@127.0.0.1:5432/phms_synthetic_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run test:appointment
